name: Publish OpenVSX mirror to Docker

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  SERVER_TAG: eu.gcr.io/gitpod-core-dev/build/openvsx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Print partial GCP_SA_KEY
      shell: bash
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        # flatten to one line so slicing is predictable
        CLEAN=$(printf '%s' "$GCP_SA_KEY" | tr -d '\n')
        FIRST="${CLEAN:0:5}"
        LAST="${CLEAN: -5}"
        echo "GCP_SA_KEY (partial): ${FIRST}...${LAST}"

    - name: Print GCP project ID
      shell: bash
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      run: |
        echo "GCP_PROJECT_ID=$GCP_PROJECT_ID"

    - name: Print partial SLACK_WEBHOOK
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      run: |
        HOOK="$SLACK_WEBHOOK"
        FIRST="${HOOK:0:5}"
        LAST="${HOOK: -8}"
        echo "SLACK_WEBHOOK (partial): ${FIRST}...${LAST}"
